name: Database Security

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-security.yml'

permissions:
  contents: read

jobs:
  rls-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.100.0

      - name: Start local database and apply migrations
        run: |
          mkdir -p supabase/migrations
          cp -n supabase/migrations_archive/*.sql supabase/migrations/
          supabase db start

      - name: Sports intelligence security and integrity regressions
        run: supabase test db supabase/tests/sports_intelligence/*.test.sql
