name: Database Security

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-security.yml'

permissions:
  contents: read

jobs:
  rls-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.100.0

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Sports intelligence security and integrity regressions
        run: supabase test db supabase/tests/sports_intelligence/*.test.sql
